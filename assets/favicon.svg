<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" fill="#2d5016"/>
  
  <!-- Coffee Cup -->
  <g transform="translate(50, 70)">
    <!-- Cup body -->
    <rect x="0" y="20" width="156" height="130" fill="none" stroke="#8B6914" stroke-width="4" rx="4"/>
    <!-- Cup bottom highlight -->
    <line x1="0" y1="150" x2="156" y2="150" stroke="#8B6914" stroke-width="4"/>
    <!-- Handle -->
    <path d="M 150 40 Q 190 40 190 90 Q 190 140 150 140" fill="none" stroke="#8B6914" stroke-width="4"/>
    <!-- Coffee inside -->
    <rect x="8" y="50" width="140" height="80" fill="#d4af37" rx="2"/>
    <!-- Steam 1 -->
    <path d="M 40 20 Q 45 5 50 20" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam 2 -->
    <path d="M 80 10 Q 85 -5 90 10" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
    <!-- Steam 3 -->
    <path d="M 120 15 Q 125 0 130 15" fill="none" stroke="#d4af37" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- M Letter for MINAS -->
  <text x="128" y="240" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#d4af37" text-anchor="middle">M</text>
</svg>
